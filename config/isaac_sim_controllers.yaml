# Isaac Sim (isaacsim.ros2.control): joint position/velocity state + effort command only,
# so the robot model comes from Pinocchio. Robot gravity is disabled in the scene (like the
# real FR3, which compensates it internally), so the controller adds no gravity term.
controller_manager:
  ros__parameters:
    update_rate: 240        # <= PhysicsScene time steps per second
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    cartesian_impedance_controller:
      type: cartesian_impedance_control/CartesianImpedanceController

cartesian_impedance_controller:
  ros__parameters:
    arm_id: fr3
    model_source: pinocchio
    urdf_path: /home/njohnson/ci_mpc_assets/fr3.urdf
    ee_frame: fr3_hand_tcp
    enable_input_server: false
    # nullspace_damping (Nms/rad) is available but not needed once the scene has FR3 joint armature
    # (ci_mpc scripts/isaac/prepare_scene.py); 0 keeps the controller identical to the real robot.
    nullspace_damping: 0.0
    # Friction handling (ci_mpc docs/PROGRESS.md, 2026-10-22 ablations in the friction scene):
    # velocity-based friction compensation (nothing at rest, stiffness stays as set) + a fast integral that
    # only acts near the target (|e| < 3 mm / 0.02, EE < 1 cm/s, not while the output is clamped) and
    # otherwise decays, so blocked motion or pushes do not wind it up. Steps settle to 0.06-0.38 mm (8 s),
    # windup jump after a held 15 N push 0.09 mm (unconditional integral: 7 mm). Real robot: not yet.
    friction_compensation: velocity
    integrator_weights: [3000.0, 3000.0, 3000.0, 50.0, 50.0, 50.0]
    integrator_limits: [8.0, 8.0, 8.0, 1.5, 1.5, 0.5]
    integrator_windows: [0.003, 0.003, 0.003, 0.02, 0.02, 0.02]
    integrator_velocity_window: 0.01
    integrator_freeze_on_saturation: true
    integrator_leak: 2.0
    integrator_reset_on_target: false
